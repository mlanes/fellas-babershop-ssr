name: CI

# The same gates that are run by hand before a pull request: lint, the
# type-check, the unit tests, both Playwright suites on every browser project,
# and the accessibility scan of the Storybook stories.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  stories:
    name: Storybook stories
    runs-on: ubuntu-latest
    # Playwright's own image, with the browsers and their system packages in
    # it. Installing those on the runner took from 16 seconds to 20 minutes,
    # as fast as Ubuntu's package mirror answered. Its version is the one in
    # the lockfile; a unit test fails when the two part.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build Storybook and scan every story
        run: npm run test:stories
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-stories
          path: test-results/
          retention-days: 7

  e2e:
    name: ${{ matrix.suite.name }} (${{ matrix.project }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    timeout-minutes: 40
    strategy:
      # One browser failing says nothing about the others; let them finish.
      fail-fast: false
      matrix:
        suite:
          - { name: Dev server, config: playwright.config.ts }
          - { name: Built site, config: playwright.built.config.ts }
        project: [chromium, firefox, webkit, Mobile Chrome, Mobile Safari]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the suite
        run: npx playwright test -c ${{ matrix.suite.config }} --project="${{ matrix.project }}"
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.suite.config }}-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
